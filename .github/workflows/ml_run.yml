name: ML Run on Docker
# on mentions a trigger for the workflow
on:
    push: # when a push is made to the main branch of the repository
jobs:
  ml_run:
    runs-on: ubuntu-latest # runs the workflow on the latest ubuntu version
    container: 
      image: jupyter/scipy-notebook:latest
      options: --user root # uses the jupyter/scipy-notebook docker image and runs the container as root user
    steps:
      - name: Checkout code
        uses: actions/checkout@v6 # uses the checkout action to checkout the code


#      - name: Set up Python
#        uses: actions/setup-python@v6 # uses the setup-python action to set up the python environment
#        with:
#          python-version: '3.13'

      - name: List installed packages
        run: 
           pip list

      - name: Install requirements dependencies
        run: 
          python -m pip install --upgrade pip
          pip install -r requirements.txt # installs the dependencies from requirements.txt     

      - name: Run scripts
        run: 
#          python -m pip install --upgrade pip
          python ml_example.py
